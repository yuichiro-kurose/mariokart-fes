<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>input</title>
</head>
<body>
  <h1>順位入力（裏方用）</h1>
  <form id="rankForm">
    <label>マリオ: <select id="rank_mario"><option value="1">1位</option><option value="2">2位</option><option value="3">3位</option><option value="4">4位</option></select></label><br>
    <label>ルイージ: <select id="rank_luigi"><option value="1">1位</option><option value="2" selected>2位</option><option value="3">3位</option><option value="4">4位</option></select></label><br>
    <label>ピーチ: <select id="rank_peach"><option value="1">1位</option><option value="2">2位</option><option value="3" selected>3位</option><option value="4">4位</option></select></label><br>
    <label>キノピオ: <select id="rank_toad"><option value="1">1位</option><option value="2">2位</option><option value="3">3位</option><option value="4" selected>4位</option></select></label><br>

    <button type="button" onclick="saveRanks()">結果を送信</button>
    <button type="button" onclick="resetRanks()" style="color: red;">終了</button>
  </form>

  <script>
    function saveRanks() {
      const results = [
        { char: 'mario', rank: Number(document.getElementById('rank_mario').value) },
        { char: 'luigi', rank: Number(document.getElementById('rank_luigi').value) },
        { char: 'peach', rank: Number(document.getElementById('rank_peach').value) },
        { char: 'toad', rank: Number(document.getElementById('rank_toad').value) }
      ];
      // 順位データをJSON文字列としてローカルストレージに保存
      localStorage.setItem('mk_results', JSON.stringify(results));
      // 表示をトリガーするためのフラグ
      localStorage.setItem('mk_trigger', Date.now());
      alert('順位を送信しました！表示画面を確認してください。');
    }

    // 終了ボタンが押された時の処理
    function resetRanks() {
      // リセットをトリガーするためのフラグを保存
      localStorage.setItem('mk_reset_trigger', Date.now());
      alert('表示画面を初期状態に戻しました。');
    }
  </script>
</body>
</html>
